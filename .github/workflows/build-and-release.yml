name: Build and release

# Every pull request and every push to main is built, tested and smoke-tested on Windows, Linux and macOS.
# The Linux job runs on your own Ubuntu server instead of GitHub's machines when the repository variable
# LINUX_RUNNER is set to self-hosted; see docs/SELF-HOSTED-RUNNER.md.
# Every push to main also publishes a GitHub Release with:
#   Tempo.exe                            Windows 10/11, keeps its files in %APPDATA%\Tempo
#   Tempo-Portable.exe                   Windows, keeps its files in a Tempo-data folder beside it
#   Tempo-linux-x64                      Linux (Debian, Ubuntu, Arch, ...), keeps its files in ~/.config/Tempo
#   Tempo-Portable-linux-x64             Linux, keeps its files beside it
#   Tempo-<version>-linux-x64.tar.gz     the Linux program with a desktop entry, icon and install script
#   tempo-dg645_<version>_amd64.deb      Debian / Ubuntu package
#   PKGBUILD                             Arch Linux package recipe (makepkg -si)
#   Tempo-<version>-macos-arm64.zip      Tempo.app for Apple Silicon Macs, keeps its files in ~/Library/Application Support/Tempo
#   Tempo-<version>-macos-x64.zip        Tempo.app for Intel Macs
#   Tempo-Quick-Reference.pdf            two-sided quick reference card for new users
# Branch pushes are not built on their own: a branch with a pull request is built once for the pull request
# rather than twice (once for the push and again for the pull request), which halves the build minutes.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel a main build mid-release; superseded branch builds can go.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  VERSION: 1.0.${{ github.run_number }}

jobs:
  windows:
    name: Windows
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Build
        run: dotnet build StanfordController.sln --configuration Release -p:Version=${{ env.VERSION }}

      - name: Test
        run: dotnet test tests/StanfordController.Tests --configuration Release --no-build --logger "console;verbosity=normal"

      - name: Publish
        shell: pwsh
        run: |
          dotnet publish src/StanfordController.App --configuration Release --runtime win-x64 --output publish/standard -p:Version=$env:VERSION
          dotnet publish src/StanfordController.App --configuration Release --runtime win-x64 --output publish/portable -p:Version=$env:VERSION -p:PortableBuild=true
          foreach ($folder in 'publish/standard', 'publish/portable') {
            $files = Get-ChildItem $folder
            $files | Format-Table Name, Length
            if ($files.Count -ne 1 -or $files[0].Name -ne 'Tempo.exe') { throw "Expected $folder to contain only Tempo.exe" }
          }
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item publish/standard/Tempo.exe dist/Tempo.exe
          Copy-Item publish/portable/Tempo.exe dist/Tempo-Portable.exe

      # Starts the real program against its built-in simulated DG645, opens every page and dialog in both
      # themes, saves a setup to a configuration, and fails on any exception or data-binding error.
      - name: UI smoke test
        shell: pwsh
        run: |
          function Invoke-SmokeTest($exe, $dir, [string[]] $extra) {
            $arguments = @('--smoke-test', "`"$dir`"") + $extra
            $process = Start-Process -FilePath (Resolve-Path $exe) -ArgumentList $arguments -PassThru
            $null = $process.Handle  # cache the handle so ExitCode is available after exit
            if (-not $process.WaitForExit(240000)) {
              $process.Kill()
              throw "The smoke test of $exe did not finish within 4 minutes."
            }
            $log = Join-Path $dir 'smoke-test.log'
            if (Test-Path $log) { Get-Content $log | Write-Host } else { Write-Warning 'No smoke test log was written.' }
            if ($process.ExitCode -ne 0) { throw "The smoke test of $exe failed with exit code $($process.ExitCode)." }
          }
          Invoke-SmokeTest dist/Tempo.exe (Join-Path $env:RUNNER_TEMP 'smoke-test') @()
          $portableDir = Join-Path $env:RUNNER_TEMP 'smoke-test-portable'
          Invoke-SmokeTest dist/Tempo-Portable.exe $portableDir @('--headless')
          if (-not (Select-String -Path (Join-Path $portableDir 'smoke-test.log') -Pattern 'portable build: True' -Quiet)) {
            throw 'Tempo-Portable.exe does not run as the portable build.'
          }

      - name: Upload smoke test screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-test-windows
          path: ${{ runner.temp }}/smoke-test
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload programs
        uses: actions/upload-artifact@v7
        with:
          name: windows
          path: dist/
          if-no-files-found: error
          retention-days: 3

  linux:
    name: Linux
    # Your own Ubuntu server (docs/SELF-HOSTED-RUNNER.md) when the repository variable LINUX_RUNNER is
    # self-hosted, otherwise GitHub's. With the variable unset nothing changes, so it is safe to switch back.
    runs-on: ${{ vars.LINUX_RUNNER == 'self-hosted' && fromJSON('["self-hosted", "Linux", "X64", "tempo"]') || 'ubuntu-24.04' }}
    timeout-minutes: 30

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        env:
          # The runner service has no root access, so on a self-hosted runner .NET goes into the runner's tool
          # cache rather than /usr/share/dotnet. It is downloaded once and reused by later builds.
          DOTNET_INSTALL_DIR: ${{ runner.environment == 'self-hosted' && format('{0}/dotnet', runner.tool_cache) || '' }}
        with:
          global-json-file: global.json

      # A self-hosted server has these installed once by its owner (docs/SELF-HOSTED-RUNNER.md).
      - name: Install a virtual display for the smoke test
        if: runner.environment == 'github-hosted'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends xvfb xauth libice6 libsm6 libfontconfig1

      - name: Build
        run: dotnet build StanfordController.sln --configuration Release -p:Version=${VERSION}

      - name: Test
        run: dotnet test tests/StanfordController.Tests --configuration Release --no-build --logger "console;verbosity=normal"

      - name: Publish
        run: |
          set -euo pipefail
          dotnet publish src/StanfordController.App --configuration Release --runtime linux-x64 --output publish/standard -p:Version=${VERSION}
          dotnet publish src/StanfordController.App --configuration Release --runtime linux-x64 --output publish/portable -p:Version=${VERSION} -p:PortableBuild=true
          for folder in publish/standard publish/portable; do
            ls -la "$folder"
            [ "$(ls "$folder")" = "Tempo" ] || { echo "Expected $folder to contain only Tempo"; exit 1; }
          done
          mkdir dist
          install -m755 publish/standard/Tempo dist/Tempo-linux-x64
          install -m755 publish/portable/Tempo dist/Tempo-Portable-linux-x64
          install -m644 docs/Tempo-Quick-Reference.pdf dist/Tempo-Quick-Reference.pdf

      - name: UI smoke test
        run: |
          set -euo pipefail
          status=0
          timeout 300 xvfb-run -a -s "-screen 0 1600x1000x24" dist/Tempo-linux-x64 --smoke-test "$RUNNER_TEMP/smoke-test" || status=$?
          cat "$RUNNER_TEMP/smoke-test/smoke-test.log" || true
          [ "$status" -eq 0 ] || { echo "The smoke test failed with exit code $status"; exit 1; }
          timeout 300 dist/Tempo-Portable-linux-x64 --smoke-test "$RUNNER_TEMP/smoke-test-portable" --headless
          grep -q 'portable build: True' "$RUNNER_TEMP/smoke-test-portable/smoke-test.log" || { echo "The portable binary does not run as the portable build"; exit 1; }

      - name: Build Debian package, tarball and Arch PKGBUILD
        run: |
          set -euo pipefail
          packaging/linux/build-packages.sh "${VERSION}" publish/standard/Tempo dist
          dpkg-deb --info "dist/tempo-dg645_${VERSION}_amd64.deb"
          dpkg-deb --contents "dist/tempo-dg645_${VERSION}_amd64.deb"

      - name: Upload smoke test screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-test-linux
          path: ${{ runner.temp }}/smoke-test
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload programs and packages
        uses: actions/upload-artifact@v7
        with:
          name: linux
          path: dist/
          if-no-files-found: error
          retention-days: 3

  macos:
    name: macOS (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x64
            runner: macos-15-intel

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Build
        run: dotnet build StanfordController.sln --configuration Release -p:Version=${VERSION}

      - name: Test
        run: dotnet test tests/StanfordController.Tests --configuration Release --no-build --logger "console;verbosity=normal"

      # A self-contained folder rather than one file: macOS signs and loads each library in an app bundle on its own.
      - name: Publish and build Tempo.app
        run: |
          set -euo pipefail
          dotnet publish src/StanfordController.App --configuration Release --runtime osx-${{ matrix.arch }} --output publish/macos -p:Version=${VERSION}
          packaging/macos/build-app.sh "${VERSION}" ${{ matrix.arch }} publish/macos dist
          rm -rf dist/Tempo.app
          ditto -x -k "dist/Tempo-${VERSION}-macos-${{ matrix.arch }}.zip" "$RUNNER_TEMP/unpacked"
          file "$RUNNER_TEMP/unpacked/Tempo.app/Contents/MacOS/Tempo"

      # The same smoke test as on Windows and Linux, run from the bundle that was zipped for release.
      - name: UI smoke test
        timeout-minutes: 6
        run: |
          set -euo pipefail
          status=0
          "$RUNNER_TEMP/unpacked/Tempo.app/Contents/MacOS/Tempo" --smoke-test "$RUNNER_TEMP/smoke-test" || status=$?
          cat "$RUNNER_TEMP/smoke-test/smoke-test.log" || true
          [ "$status" -eq 0 ] || { echo "The smoke test failed with exit code $status"; exit 1; }

      - name: Upload smoke test screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-test-macos-${{ matrix.arch }}
          path: ${{ runner.temp }}/smoke-test
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload program
        uses: actions/upload-artifact@v7
        with:
          name: macos-${{ matrix.arch }}
          path: dist/
          if-no-files-found: error
          retention-days: 3

  release:
    name: Publish GitHub Release
    needs: [windows, linux, macos]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download the Windows programs
        uses: actions/download-artifact@v8
        with:
          name: windows
          path: dist

      - name: Download the Linux programs and packages
        uses: actions/download-artifact@v8
        with:
          name: linux
          path: dist

      - name: Download the macOS programs
        uses: actions/download-artifact@v8
        with:
          pattern: macos-*
          merge-multiple: true
          path: dist

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd dist
          chmod +x Tempo-linux-x64 Tempo-Portable-linux-x64
          sha256sum Tempo-linux-x64 Tempo-Portable-linux-x64 Tempo.exe Tempo-Portable.exe Tempo-*.tar.gz tempo-dg645_* PKGBUILD Tempo-*-macos-*.zip Tempo-Quick-Reference.pdf > SHA256SUMS.txt
          cat SHA256SUMS.txt
          cat > notes.md <<NOTES
          | Download | For |
          | --- | --- |
          | **Tempo.exe** | Windows 10 and 11. Keeps instruments and setups in %APPDATA%\\Tempo. |
          | **Tempo-Portable.exe** | Windows, from a USB stick or shared folder. Keeps everything in a Tempo-data folder beside it. |
          | **tempo-dg645_${VERSION}_amd64.deb** | Debian and Ubuntu: \`sudo apt install ./tempo-dg645_${VERSION}_amd64.deb\` |
          | **PKGBUILD** | Arch Linux: put it in an empty folder and run \`makepkg -si\` |
          | **Tempo-${VERSION}-macos-arm64.zip** | Macs with Apple Silicon (M1 or later), macOS 12 or later. Unzip and drag Tempo to Applications. Not notarized: the first time, see *macOS will not open Tempo* in the user guide. |
          | **Tempo-${VERSION}-macos-x64.zip** | Intel Macs, macOS 12 or later. |
          | **Tempo-${VERSION}-linux-x64.tar.gz** | Any x86-64 Linux desktop: unpack, then \`./install.sh\` or run \`./tempo-dg645\` |
          | **Tempo-linux-x64** / **Tempo-Portable-linux-x64** | The bare Linux program (\`chmod +x\` after downloading). |
          | **Tempo-Quick-Reference.pdf** | Two-sided quick reference card for new users (print double-sided). |

          SHA256SUMS.txt lists the checksum of every file.
          NOTES
          gh release create "v${VERSION}" Tempo.exe Tempo-Portable.exe Tempo-linux-x64 Tempo-Portable-linux-x64 \
            "Tempo-${VERSION}-linux-x64.tar.gz" "tempo-dg645_${VERSION}_amd64.deb" PKGBUILD \
            "Tempo-${VERSION}-macos-arm64.zip" "Tempo-${VERSION}-macos-x64.zip" Tempo-Quick-Reference.pdf SHA256SUMS.txt \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "Tempo ${VERSION}" \
            --notes "$(cat notes.md)" \
            --generate-notes \
            --latest
